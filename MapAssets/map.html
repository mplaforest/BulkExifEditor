<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body,#map{height:100%;margin:0;padding:0;}</style>
</head>
<body>
<div id="map"></div>
<script>
  // The Google Maps script tag itself is injected from C# after this page loads
  // (MainWindow.xaml.cs InitMapAsync) so the API key never has to live in this file -
  // this file is committed to git, the key is not. initMap() is Google's callback once
  // its script has loaded; setMarkers() may be called by C# before that happens, so it
  // just queues the latest points until the map object actually exists.
  var map;
  var geocoder;
  var pendingArgs = null;

  // Query text -> {lat,lng} | null (null means "looked up, no match" - cached too, so
  // a photo with an ungeocodable filename doesn't retry every time the selection changes).
  var geocodeCache = {};

  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 20, lng: 0 },
      zoom: 2,
      zoomControl: true,
      streetViewControl: false,
      mapTypeControl: true,
      fullscreenControl: false
    });
    geocoder = new google.maps.Geocoder();

    if (pendingArgs) {
      var a = pendingArgs;
      pendingArgs = null;
      setMarkers(a.points, a.guesses);
    }

    // Clicking a marker fires the marker's own click, not this one, so this only
    // fires for clicks on open map area - sent to the C# host via WebMessageReceived.
    map.addListener('click', function(e) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ lat: e.latLng.lat(), lng: e.latLng.lng() });
      }
    });
  }

  var markers = [];

  // `points` are photos with real GPS EXIF data (normal pins). `guesses` are photos
  // with no GPS data but a place-name-looking fragment pulled from their filename (e.g.
  // "Bomoseen Vermont Vt" from "_Bomoseen_Vermont_Vt_002.CR3") - each is geocoded via
  // Google's Geocoder and shown as an orange pin if a match is found, clearly labeled as
  // approximate so it's never confused with a real recorded GPS position.
  function setMarkers(points, guesses) {
    guesses = guesses || [];

    if (!map) { pendingArgs = { points: points, guesses: guesses }; return; }

    markers.forEach(function(m) { m.setMap(null); });
    markers = [];

    var bounds = new google.maps.LatLngBounds();
    var hasAny = false;

    points.forEach(function(p) {
      var pos = { lat: p.Lat, lng: p.Lon };
      var m = new google.maps.Marker({ position: pos, map: map, title: p.Name });
      markers.push(m);
      bounds.extend(pos);
      hasAny = true;
    });

    var pendingGeocodes = guesses.length;
    if (pendingGeocodes === 0) {
      finishPlacement(bounds, hasAny);
      return;
    }

    guesses.forEach(function(g) {
      resolveGuess(g.Query, function(pos) {
        if (pos) {
          var m = new google.maps.Marker({
            position: pos,
            map: map,
            title: g.Name + ' - approximate location guessed from filename ("' + g.Query + '")',
            icon: 'https://maps.google.com/mapfiles/ms/icons/orange-dot.png'
          });
          markers.push(m);
          bounds.extend(pos);
          hasAny = true;
        }
        pendingGeocodes--;
        if (pendingGeocodes === 0) finishPlacement(bounds, hasAny);
      });
    });
  }

  function resolveGuess(query, callback) {
    if (geocodeCache.hasOwnProperty(query)) { callback(geocodeCache[query]); return; }
    geocoder.geocode({ address: query }, function(results, status) {
      var pos = (status === 'OK' && results && results[0])
        ? { lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng() }
        : null;
      geocodeCache[query] = pos;
      callback(pos);
    });
  }

  function finishPlacement(bounds, hasAny) {
    if (!hasAny) {
      map.setCenter({ lat: 20, lng: 0 });
      map.setZoom(2);
      return;
    }

    if (markers.length === 1) {
      map.setCenter(bounds.getCenter());
      map.setZoom(14);
    } else {
      map.fitBounds(bounds, 20);
      // fitBounds zooms to the max level when every point is the same (or very close
      // together), landing at street level - clamp it back down afterward in that case.
      // fitBounds applies asynchronously, so this has to wait for the next idle event.
      google.maps.event.addListenerOnce(map, 'idle', function() {
        if (map.getZoom() > 16) map.setZoom(16);
      });
    }
  }
</script>
</body>
</html>
